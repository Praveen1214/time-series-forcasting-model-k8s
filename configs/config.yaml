# Configuration for K8s Predictive Autoscaler

# Data Configuration
data:
  csv_path: '../data/k8s.csv'
  service_id: 'Order'  # null for all services
  train_ratio: 0.70
  val_ratio: 0.15
  target_col: 'next_pod_count'
  feature_cols:
    - current_pod_count
    - request_rate_rps
    - latency_p95_ms
    - error_rate_percent
    - queue_length
    - pod_cpu_usage_percent_avg
    - pod_cpu_usage_percent_p95
    - pod_memory_usage_mb_avg
    - pod_memory_usage_mb_p95
    - mesh_inbound_rps
    - mesh_inbound_latency_p95
    - mesh_inbound_error_rate
    - degree_centrality
    - eigenvector_centrality
    - betweenness_centrality
    - closeness_centrality
    - hour_sin
    - hour_cos
    - day_sin
    - day_cos

# Model Architecture Configuration
model:
  lookback: 10          # Number of past timesteps to use
  d_model: 64           # Model dimension
  num_heads: 4          # Number of attention heads
  num_layers: 2         # Number of transformer blocks
  dff: 128              # Feed-forward network dimension
  dropout_rate: 0.1     # Dropout rate

# Training Configuration
training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 20
  reduce_lr_patience: 10
  checkpoint_path: '../models/checkpoints/informer_k8s_best.keras'
  model_save_path: '../models/informer_k8s'

# Evaluation Configuration
evaluation:
  test_batch_size: 32
  metrics:
    - mae
    - rmse
    - mape
    - r2

# Deployment Configuration (for future use)
deployment:
  model_path: '../models/informer_k8s/model.keras'
  api_host: '0.0.0.0'
  api_port: 8000
  max_workers: 4
